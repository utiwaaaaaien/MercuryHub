name: Publish MercuryHub

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:pages
      - run: node --experimental-strip-types scripts/generate-checks.mjs pages-dist/checks.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Record scheduled checks in repository
        if: github.event_name != 'push'
        run: |
          cp pages-dist/checks.json checks.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add checks.json
          git commit -m "Record link checks $(date -u +%F)"
          git push origin HEAD:main
